<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Watchman Login — TenX Habitat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="card shadow mx-auto" style="max-width: 350px;">
    <div class="card-body text-center">
      <h4 class="text-primary mb-3 fw-bold">🔐 TenX - Watchman Login</h4>
      <form method="POST" action="{{ url_for('watchman_login') }}">
        <div class="mb-3">
          <input type="password" name="pin" maxlength="3" minlength="3" class="form-control text-center"
                 placeholder="Enter your 3-digit PIN" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
        <div class="text-center mt-3">
          <a href="{{ url_for('watchman_register') }}">New? Register here</a>
        </div>
      </form>
    </div>
  </div>
</div>
<!-- ✅ Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // ✅ Show registration success popup
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('registered') === 'true') {
    alert('✅ Registration successful! Please use your 3-digit PIN to log in.');
  }

<!--      {% endfor %}-->

<!--  {% endwith %}-->
</script>
</body>
</html>
