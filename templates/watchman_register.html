<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Watchman Registration — {{ society_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="card shadow mx-auto" style="max-width: 400px;">
    <div class="card-body">
      <h4 class="text-center mb-3 text-primary fw-bold">🛡️ {{ society_name }} - Register Watchman</h4>
      <form method="POST" action="{{ url_for('watchman_register') }}">
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" name="name" class="form-control" placeholder="Enter name" required>
        </div>
        <div class="mb-3">
          <label class="form-label">3-digit PIN</label>
          <input type="password" name="pin" maxlength="3" minlength="3" class="form-control" placeholder="e.g. 123" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Phone Number</label>
          <input type="tel" name="phone" pattern="[0-9]{10}" maxlength="10"
                 class="form-control" placeholder="10-digit mobile number" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Register</button>
        <div class="text-center mt-3">
          <a href="{{ url_for('watchman_login') }}">Already registered? Login</a>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
