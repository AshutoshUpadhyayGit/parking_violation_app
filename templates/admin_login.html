<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login — TenX Habitat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(180deg, #f6f8fb 0%, #eef3ff 100%);
      font-family: Inter, system-ui, "Segoe UI", Roboto;
    }
    .login-card {
      max-width: 420px;
      margin: 8% auto;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(13,110,253,0.08);
      padding: 2.2rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h4 class="text-primary text-center mb-3 fw-bold">TenX Habitat Admin Login</h4>
    <p class="text-muted text-center mb-4 small">Authorized society administrators only</p>

    <form method="POST" action="{{ url_for('admin_login') }}" autocomplete="off">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" autocomplete="new-username" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" autocomplete="new-password" required>
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-primary btn-lg">Login</button>
      </div>
    </form>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-danger alert-dismissible fade show mt-3">{{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="text-center mt-4">
      <a href="{{ url_for('index') }}" class="small text-decoration-none text-secondary">← Back to Dashboard</a>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
